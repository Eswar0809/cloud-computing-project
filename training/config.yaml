# Training Configuration for Sequence-Level Distillation of Pythia-70M
# Task 2 Requirements: seed, learning_rate, batch_size, num_epochs, max_seq_length, library_versions

seed: 42
learning_rate: 0.0001
batch_size: 4
num_epochs: 3
max_seq_length: 48

library_versions:
  torch: "2.11.0"
  transformers: "5.12.1"
  tokenizers: "0.22.2"
  python: "3.11.9"

# S3 and storage paths
model_name: "EleutherAI/pythia-70m"
train_dataset_path: "datasets/v1/train.jsonl"
s3_endpoint: "http://127.0.0.1:8333"
models_bucket: "models"
output_dir_v1: "models/v1"
output_dir_v2: "models/v2"
loss_csv: "training/loss.csv"
